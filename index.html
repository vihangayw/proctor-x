<!DOCTYPE html>
<html>
<head>
    <title>ProctorX</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #222;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .controls {
      padding: 10px;
      background: #333;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #shareScreen {
      background: #4CAF50;
      color: white;
    }
    #stopShare {
      background: #f44336;
      color: white;
    }
    #exitApp {
      background: #ff4444;
      color: white;
      margin-left: auto;
    }
    .content-container {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      height: calc(100vh - 50px);
    }
    #lmsFrame {
      width: 100%;
      flex-grow: 1;
      border: none;
      background: white;
    }
    #screenView {
      margin-top: 10px;
      width: 100%;
      height: auto;
      background: #000;
      display: none; /* Hidden by default */
    }

    /*.screen-sharing-active #lmsFrame {*/
    /*  display: none;*/
    /*}*/
    /*.screen-sharing-active #screenView {*/
    /*  display: block;*/
    /*}*/
  </style>
</head>
<body>
<div style="display: none" class="controls">
  <button id="shareScreen">Share Screen</button>
  <button id="stopShare" disabled>Stop Sharing</button>
  <button id="exitApp">Exit Application</button>
</div>

<div class="content-container">
  <iframe id="lmsFrame"
          allowfullscreen
          allow="camera; microphone; fullscreen"
          style="flex:1; width:100%; border:none;"></iframe>

    <!--  <video id="screenView" autoplay></video>-->
</div>

<script src="renderer.js"></script>
</body>
</html>
