<!DOCTYPE html>
<html>
<head>
    <title>ProctorX</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #024565;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .controls {
      padding: 10px;
      background: #024565;
        display: none; /* Hide the entire controls band */
      gap: 10px;
      flex-shrink: 0;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #shareScreen {
      background: #93ba49;
      color: white;
    }
    #stopShare {
      background: #f44336;
      color: white;
    }
    #exitApp {
      background: #f44336;
      color: white;
      margin-left: auto;
        display: none; /* Hide the exit application button */
    }

    #shareScreen {
        display: none; /* Hide the share screen button */
    }
    .content-container {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      height: calc(100vh - 50px);
    }
    #lmsFrame {
      width: 100%;
      flex-grow: 1;
      border: none;
      background: white;
    }
    #screenView {
      margin-top: 10px;
      width: 100%;
      height: auto;
      background: #000;
      display: none; /* Hidden by default */
    }

    /*.screen-sharing-active #lmsFrame {*/
    /*  display: none;*/
    /*}*/
    /*.screen-sharing-active #screenView {*/
    /*  display: block;*/
    /*}*/

    /* Disable text selection globally */
    * {
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
        -webkit-touch-callout: none !important;
        -webkit-tap-highlight-color: transparent !important;
    }

    /* Also disable selection on iframe */
    iframe {
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        -ms-user-select: none !important;
        user-select: none !important;
    }
  </style>
</head>
<body>
<div class="controls">
  <button id="shareScreen">Share Screen</button>
  <button id="stopShare" disabled>Stop Sharing</button>
  <button id="exitApp">Exit Application</button>
</div>

<div class="content-container">
  <iframe id="lmsFrame"
          allowfullscreen
          allow="camera; microphone; fullscreen; display-capture; autoplay; encrypted-media; picture-in-picture"
          style="flex:1; width:100%; border:none;"></iframe>

    <!--  <video id="screenView" autoplay></video>-->

    <!-- LiveKit Room Container -->
    <div id="livekit-room"
         style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000;">
        <div style="position: absolute; top: 20px; right: 20px;">
            <button id="closeLivekit"
                    style="background: #93ba49; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer;">
                Close
            </button>
        </div>
        <div id="livekit-participants" style="display: flex; flex-wrap: wrap; gap: 10px; padding: 20px;">
            <!-- LiveKit participants will be rendered here -->
        </div>
    </div>
</div>

<!-- LiveKit Scripts -->
<script type="module" src="renderer.js"></script>
</body>
</html>
